<div class="wrap">
  <div class="page-head">
    <h1>Les créations</h1>
    <p class="muted">Des poupées crochetées à la main. Touchez une création pour choisir ses couleurs.</p>
  </div>
  <div class="filters" role="group" aria-label="Filtrer les créations" id="filters">
    <button class="chip" type="button" data-filter="toutes" aria-pressed="true">Toutes</button>
    <button class="chip" type="button" data-filter="disponibles" aria-pressed="false">Disponibles</button>
    <button class="chip" type="button" data-filter="personnalisables" aria-pressed="false">Personnalisables</button>
    <button class="chip" type="button" data-filter="nouveautes" aria-pressed="false">Nouveautés</button>
    <button class="chip" type="button" data-filter="best-sellers" aria-pressed="false">Best-sellers</button>
  </div>
  <p class="sr" aria-live="polite" id="result-count"></p>
  <div class="grid" id="catalog" style="margin-bottom:72px"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
</div>
